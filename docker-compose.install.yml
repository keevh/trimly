services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: trimly
      POSTGRES_USER: trimly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trimly -d trimly"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    image: ${TRIMLY_IMAGE:?Set TRIMLY_IMAGE in .env}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://trimly:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/trimly
      APP_BASE_URL: ${APP_BASE_URL:?Set APP_BASE_URL in .env}
      IP_HASH_SALT: ${IP_HASH_SALT:?Set IP_HASH_SALT in .env}
      CLEANUP_GRACE_DAYS: 30
      DEMO_EXPIRY_DAYS: 7
      RATE_LIMIT_MAX: 3
      RATE_LIMIT_WINDOW_HOURS: 24
    ports:
      - "${TRIMLY_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
