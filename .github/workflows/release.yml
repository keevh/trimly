name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

      - name: Prepare versioned installer
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sed "s/__TRIMLY_VERSION__/${RELEASE_TAG}/g" scripts/install.sh > install.sh
          bash -n install.sh
          installer_output="$(bash install.sh 2>&1 || true)"
          [[ "$installer_output" != *"Este script debe descargarse desde un release"* ]]

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/keevh/trimly:${{ github.event.release.tag_name }}
            ghcr.io/keevh/trimly:latest

      - name: Attach installation files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" install.sh docker-compose.install.yml --clobber
